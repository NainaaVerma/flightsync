version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flightsync

  flightsync:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - redis
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: local
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ALERT_EMAILS: ${ALERT_EMAILS}
      FLIGHT_ROUTES: Mumbai->Delhi,Bangalore->Mumbai
      DB_URL: jdbc:mysql://mysql:3306/flightsync
      DB_USERNAME: root
      DB_PASSWORD: root